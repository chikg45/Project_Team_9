name: Validate merged Stage 1 and Stage 2
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Project_Team_9/**'
      - 'notebooks/**'
      - 'Data/**'
      - 'data_goc/**'
      - 'requirements.txt'
      - 'run_notebook.py'
      - 'Dockerfile'
      - '.github/workflows/validate-notebook.yml'
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute notebook
        run: python run_notebook.py
      - name: Archive execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-stage2-execution
          path: |
            notebooks/ket_qua/
            app/*.csv
            Data/processed/
          if-no-files-found: warn
